name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run against a branch on demand: the dependencies are resolved fresh each
  # run (uv.lock is not committed), so a green result can go red — or back to
  # green — without anything here changing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Ruff lint
        run: uvx ruff check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra pymodbus --extra tmodbus
      - name: Run tests
        run: uv run pytest
